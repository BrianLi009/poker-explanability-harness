/* Layout: a solver-console sheet. Summary band on top, then the coach's order:
   global shape (range grid + action ranges), borderlines, EV at the border,
   the table's response, card removal, other lines, ICM, coverage. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #17202a;
  --muted: #5b6878;
  --line: #d6dde5;
  --soft: #e4e9ef;
  --accent: #1d6b57;
  --accent-ink: #ffffff;
  --a-allin: #7a1c2b;
  --a-raise3: #a1283a;
  --a-raise2: #c9433a;
  --a-raise1: #e0735a;
  --a-call: #3a9a5c;
  --a-check: #4b82c4;
  --a-fold: #3e6fae;
  --good: #2f8a55;
  --warn: #b7791f;
  --bad: #b23a3a;
  --empty: #e9edf2;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --panel: #161d25; --ink: #e5eaf0; --muted: #91a0b0; --line: #26313d; --soft: #1d2631;
    --accent: #47b394; --accent-ink: #08130f; --empty: #1b232c;
    --a-fold: #4a7cc0; --a-check: #5b90d0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --panel: #161d25; --ink: #e5eaf0; --muted: #91a0b0; --line: #26313d; --soft: #1d2631;
  --accent: #47b394; --accent-ink: #08130f; --empty: #1b232c;
  --a-fold: #4a7cc0; --a-check: #5b90d0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 800; font-stretch: 75%; letter-spacing: -0.01em; line-height: 1.05; }
h2 { font-size: 15px; font-weight: 700; font-stretch: 80%; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
h3 { font-size: 16px; font-weight: 700; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.step { font-family: var(--font-data); font-size: 12px; color: var(--accent); margin-right: 8px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 900px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }

/* Header */
.eyebrow { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.chip.accent { background: var(--accent); color: var(--accent-ink); }
header.top { display: flex; flex-direction: column; gap: 10px; }
.source { font-size: 12.5px; color: var(--muted); max-width: 90ch; }
.seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; }
.seat { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--panel); display: flex; flex-direction: column; gap: 1px; }
.seat .name { font-weight: 700; font-size: 13px; font-stretch: 85%; font-family: var(--font-display); }
.seat .stack { font-family: var(--font-data); font-size: 13px; }
.seat .tag { font-size: 11px; color: var(--muted); }
.seat.hero { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.seat.villain { border-color: var(--a-raise2); box-shadow: inset 0 0 0 1px var(--a-raise2); }
.board { display: flex; gap: 6px; }
.card { width: 38px; height: 52px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 19px; }
.suit-s { color: var(--ink); } .suit-h { color: #c4313b; } .suit-d { color: #2f6fd0; } .suit-c { color: #2f8a55; }

/* Summary band */
.summary { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: stretch; }
@media (max-width: 900px) { .summary { grid-template-columns: minmax(0, 1fr); } }
.takeaway { background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
.takeaway .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.85; font-weight: 700; }
.takeaway p { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.35; font-family: var(--font-display); font-stretch: 92%; }
.takeaway ul { margin: 4px 0 0; padding-left: 18px; font-size: 14px; opacity: 0.92; }

/* Action bar */
.actbar { display: flex; height: 34px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); }
.actbar > div { display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-data); font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.rangelist { display: flex; flex-direction: column; gap: 8px; }
.rangelist .row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: baseline; }
@media (max-width: 560px) { .rangelist .row { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.rangelist .who { font-weight: 700; font-size: 14px; }
.rangelist .hands { font-family: var(--font-data); font-size: 13px; overflow-wrap: anywhere; }

/* Range grid */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: inherit; font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab:focus-visible, .ladder button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rgrid-wrap { overflow-x: auto; }
.rgrid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; min-width: 300px; }
.cell { position: relative; aspect-ratio: 1 / 1; border-radius: 3px; overflow: hidden; background: var(--empty); display: flex; }
.cell .bars { position: absolute; inset: 0; display: flex; }
.cell .bars > i { display: block; height: 100%; }
.cell .lab { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-stretch: 75%; font-size: clamp(7.5px, 1.1vw, 12.5px); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,0.35); pointer-events: none; }
.cell.empty .lab { color: var(--muted); text-shadow: none; opacity: 0.6; }
.cell.dim { opacity: 0.35; }
.cell.mark-in { box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px var(--ink); z-index: 1; }
.cell.mark-out { box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px var(--warn); z-index: 1; }
.cell.hero-hand { box-shadow: inset 0 0 0 2px #fff, 0 0 0 3px var(--accent); z-index: 2; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.4; max-width: 260px; }
.keyline { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.keybox { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -2px; background: var(--empty); }

/* Ladders */
.ladders { display: flex; flex-direction: column; gap: 10px; }
.ladder { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: center; }
@media (max-width: 560px) { .ladder { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.ladder .fam { font-size: 13px; font-weight: 600; }
.ladder .rungs { display: grid; grid-template-columns: repeat(13, minmax(22px, 1fr)); gap: 2px; overflow-x: auto; }
.ladder .rungs .cell { aspect-ratio: auto; height: 30px; }
.ladder .note { grid-column: 2; font-size: 12.5px; color: var(--muted); }
@media (max-width: 560px) { .ladder .note { grid-column: 1; } }

svg text { fill: var(--muted); font-family: var(--font-data); font-size: 11px; }
svg .ink { fill: var(--ink); }
.funnel { display: flex; flex-direction: column; gap: 8px; }
.frow { display: grid; grid-template-columns: 110px minmax(0, 1fr) 92px; gap: 10px; align-items: center; font-size: 13px; }
.frow .bar { height: 18px; background: var(--soft); border-radius: 4px; overflow: hidden; display: flex; }
.frow .bar > i { display: block; height: 100%; }
.frow .val { font-family: var(--font-data); text-align: right; }
.gauge { position: relative; height: 26px; background: var(--soft); border-radius: 6px; overflow: visible; }
.gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--a-fold); }
.gauge .need { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--bad); }
.gauge .needlab { position: absolute; top: -22px; transform: translateX(-50%); font-size: 11.5px; color: var(--bad); font-family: var(--font-data); white-space: nowrap; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .big { font-family: var(--font-data); font-size: 26px; font-weight: 600; }
.stats { display: flex; gap: 24px; flex-wrap: wrap; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--soft); vertical-align: top; }
table.t td.num { text-align: right; }
.tbl-wrap { overflow-x: auto; }
.cov { display: flex; flex-wrap: wrap; gap: 6px; }
.cov span { font-size: 12.5px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line); display: inline-flex; gap: 6px; align-items: center; }
.cov .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.evsvg { width: 100%; max-width: 620px; height: auto; display: block; }
.alt { border-left: 3px solid var(--line); padding-left: 12px; display: flex; flex-direction: column; gap: 6px; }
p { margin: 0; }
.prose { max-width: 70ch; font-size: 14px; }
footer { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .cell, .tab { transition: opacity .15s, box-shadow .15s, background .15s; } }
</style>

}

/* ---------- borderline ladders ---------- */
function laddersPanel() {
  if (!D.borders.length) return null;
  const acts = order(Object.keys(D.node.actions));
  const cm = colorMap(acts);
  const fams = D.families.filter((f) => D.borders.some((b) => b.family === f.name));
  const box = $("div", { class: "ladders" });
  for (const f of fams) {

    for (const cls of members) {
      const el = cellEl(cls, D.grid[cls], cm, acts);
      if (D.border_hands[cls] === "in") el.classList.add("mark-in");
      if (D.border_hands[cls] === "out") el.classList.add("mark-out");
      if (D.hero_hand && cls === D.hero_hand.class) el.classList.add("hero-hand");

    }
    for (let k = 0; k < pad; k++) rungs.append($("div"));
    const notes = D.borders.filter((b) => b.family === f.name).map((b) => {

      const gaps = b.gaps.length ? `; gap: ${b.gaps.slice(0, 3).map((g) => `${g} → ${b.gap_does[g]}`).join(", ")}${b.gaps.length > 3 ? "…" : ""}` : "";
      return `${b.action}: ${b.range}${below}${gaps}`;

    box.append($("div", { class: "ladder" }, $("span", { class: "fam" }, f.name), rungs, $("span", { class: "note" }, notes.join("  ·  "))));
  }
  return $("section", { class: "panel" },
    $("div", { class: "panel-head" }, $("h2", {}, $("span", { class: "step" }, "2"), "Borderlines by family"), $("span", { class: "small muted" }, "strongest → weakest")),
    $("p", { class: "prose muted" }, "Each row is one hand family from its strongest to its weakest hand, coloured by what the solver does. The dark outline is the worst hand still taking an action; the amber outline is the first hand that stops."),
    box);
}

/* ---------- EV at the border ---------- */
function evPanel() {
  const rows = (D.ev_border || []).filter((r) => r.ev && Object.keys(r.ev).length);
  if (!rows.length) return null;
  const acts = order([...new Set(rows.flatMap((r) => Object.keys(r.ev)))]);
  const cm = colorMap(acts);
  const all = rows.flatMap((r) => Object.values(r.ev));
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  const span = Math.max(0.04, hi - lo); lo -= span * 0.08; hi += span * 0.08;
  const W = 560, rowH = 26, left = 70, right = 18, top = 26, H = top + rows.length * rowH + 22;
  const x = (v) => left + ((v - lo) / (hi - lo)) * (W - left - right);
  const ns = "http://www.w3.org/2000/svg";
  const s = (tag, a) => { const el = document.createElementNS(ns, tag); for (const k in a) el.setAttribute(k, a[k]); return el; };
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, class: "evsvg", role: "img", "aria-label": "EV of each action for the hands at the borders" });
  const ticks = niceTicks(lo, hi, 5);
  for (const t of ticks) {
    svg.append(s("line", { x1: x(t), x2: x(t), y1: top - 6, y2: H - 18, stroke: "var(--soft)", "stroke-width": t === 0 ? 2 : 1 }));
    const tl = s("text", { x: x(t), y: H - 4, "text-anchor": "middle" }); tl.textContent = `${t >= 0 ? "+" : ""}${t.toFixed(2)}`; svg.append(tl);
  }
  const zl = s("text", { x: x(0), y: 12, "text-anchor": "middle" }); zl.textContent = "0 = fold"; svg.append(zl);
  rows.forEach((r, i) => {
    const y = top + i * rowH + rowH / 2;
    const lab = s("text", { x: 8, y: y + 4, class: "ink" }); lab.textContent = r.hand; svg.append(lab);
    const vals = acts.filter((a) => r.ev[a] !== undefined);
    const xs = vals.map((a) => x(r.ev[a]));
    svg.append(s("line", { x1: Math.min(...xs), x2: Math.max(...xs), y1: y, y2: y, stroke: "var(--line)", "stroke-width": 2 }));
    for (const a of vals) {
      const c = s("circle", { cx: x(r.ev[a]), cy: y, r: a === r.takes ? 6.5 : 4.5, fill: cm[a], stroke: a === r.takes ? "var(--ink)" : "none", "stroke-width": 1.5 });
      const tt = document.createElementNS(ns, "title"); tt.textContent = `${r.hand}: ${a} ${bb(r.ev[a])}`; c.append(tt);
      svg.append(c);
    }
  });
  return $("section", { class: "panel" },
    $("div", { class: "panel-head" }, $("h2", {}, $("span", { class: "step" }, "3"), "EV at the borders"), $("div", { class: "legend" }, acts.map((a) => $("span", {}, $("span", { class: "sw", style: `background:${cm[a]}` }), a)))),
    $("p", { class: "prose muted" }, "EV of each action, in big blinds, for the hands where the strategy changes. The ringed dot is what the solver picks. When the dots sit on top of each other, the hand is close to indifferent."),
    $("div", { class: "rgrid-wrap" }, svg));
}
function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n; const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((st) => st >= raw) || raw;
  const out = []; for (let t = Math.ceil(lo / step) * step; t <= hi + 1e-9; t += step) out.push(+t.toFixed(6));
  return out;
}

/* ---------- response funnel ---------- */
function responsePanel() {
  const r = D.response; if (!r) return null;

  const rows = $("div", { class: "funnel" });
  let through = 1; let known = true;

      $("div", { class: "bar", title: acts.map((a) => `${a} ${pct(p.actions[a])}`).join(", ") }, acts.map((a) => $("i", { style: `width:${p.actions[a]}%;background:${cm[a]}` }))),
      $("span", { class: "val" }, p.fold !== null ? `${pct(p.fold)} fold` : "")));
    if (p.fold === null) known = false; else through *= p.fold / 100;
  }
  const racts = order(Object.keys(r.actions)); const rcm = colorMap(racts);
  const rfold = Object.entries(r.actions).find(([a]) => /^fold/i.test(a));
  rows.append($("div", { class: "frow" }, $("b", {}, r.player),
    $("div", { class: "bar", title: racts.map((a) => `${a} ${pct(r.actions[a])}`).join(", ") }, racts.map((a) => $("i", { style: `width:${r.actions[a]}%;background:${rcm[a]}` }))),
    $("span", { class: "val" }, rfold ? `${pct(rfold[1])} fold` : "")));
  const parts = [$("div", { class: "panel-head" }, $("h2", {}, $("span", { class: "step" }, "4"), "How the table responds"), $("span", { class: "small muted" }, `facing ${r.facing || "the action"}`)), rows];
  if (rfold && rf.breakeven_fold !== undefined) {
    const allFold = (known ? through : 1) * rfold[1];
    const need = rf.breakeven_fold;
    parts.push(
      $("div", { class: "stats" },
        $("div", { class: "stat" }, $("span", { class: "muted small" }, D.response_path.length ? "Everyone folds (rough)" : `${r.player} folds`), $("span", { class: "big" }, pct(allFold))),
        $("div", { class: "stat" }, $("span", { class: "muted small" }, "Needed with zero equity"), $("span", { class: "big", style: "color:var(--bad)" }, pct(need))),
        r.pot_odds !== null && r.pot_odds !== undefined ? $("div", { class: "stat" }, $("span", { class: "muted small" }, `${r.player}'s pot odds`), $("span", { class: "big" }, pct(r.pot_odds > 1 ? r.pot_odds : r.pot_odds * 100))) : null),
      $("div", { style: "padding-top:22px" }, $("div", { class: "gauge", role: "img", "aria-label": `Fold-through ${pct(allFold)} against ${pct(need)} needed` },
        $("div", { class: "fill", style: `width:${allFold}%` }), $("div", { class: "need", style: `left:${need}%` }), $("span", { class: "needlab", style: `left:${need}%` }, `needed ${pct(need)}`))),
      $("p", { class: "prose muted" }, allFold < need

        : `Folds alone pay for this bet: ${pct(allFold)} against ${pct(need)} needed, so even hands with no equity profit.`));
  }
  if (r.note) parts.push($("p", { class: "small muted" }, r.note));

}

/* ---------- card removal ---------- */
function blockersPanel() {
  const b = D.blockers || {};
  const comp = b.compare;
  if (!comp && b.cont_removed_pct === undefined && !b.groups) return null;
  const parts = [$("div", { class: "panel-head" }, $("h2", {}, $("span", { class: "step" }, "5"), "Card removal"))];
  if (comp) {
    const names = Object.keys(comp);
    const vals = names.map((n) => comp[n].villain_fold_pct);
    const lo = Math.floor(Math.min(...vals, b.fold_before || 100) - 1), hi = Math.ceil(Math.max(...vals, b.fold_before || 0) + 1);
    const box = $("div", { class: "funnel" });
    for (const n of names) {
      const v = comp[n].villain_fold_pct;
      box.append($("div", { class: "frow" }, $("span", {}, n),
        $("div", { class: "bar" }, $("i", { style: `width:${((v - lo) / (hi - lo)) * 100}%;background:var(--a-fold)` })),
        $("span", { class: "val" }, pct(v))));
    }
    parts.push($("p", { class: "prose muted" }, `${D.villain}'s fold frequency against each hand after card removal${b.fold_before !== undefined ? ` (no removal: ${pct(b.fold_before)})` : ""}. Axis runs ${lo}% to ${hi}%.`), box);
    const spread = Math.max(...vals) - Math.min(...vals);
    parts.push($("p", { class: "small" }, spread < 1 ? "These hands block almost the same, so card removal doesn't explain why they play differently." : "The spread here is part of why these hands play differently."));
  } else if (b.cont_removed_pct !== undefined) {
    parts.push($("p", { class: "prose" }, `Your hand removes ${pct(b.cont_removed_pct)} of ${D.villain}'s continuing combos and ${pct(b.fold_removed_pct)} of its folds.`));
  }
  if (b.groups) {
    const t = $("table", { class: "t" }, $("thead", {}, $("tr", {}, $("th", {}, "Group"), $("th", {}, "Before"), $("th", {}, "After"), $("th", {}, "Removed"))),
      $("tbody", {}, b.groups.filter((g) => g.removed_pct > 0).map((g) => $("tr", {}, $("td", {}, g.group), $("td", { class: "num" }, g.before), $("td", { class: "num" }, g.after), $("td", { class: "num" }, pct(g.removed_pct))))));
    parts.push($("div", { class: "tbl-wrap" }, t));
  }
  return $("section", { class: "panel" }, parts);
}

/* ---------- other lines, ICM, rewind, breakdown ---------- */
function linesPanel() {
  const alts = D.alternatives || [];
  if (!alts.length) return null;
  const parts = [$("div", { class: "panel-head" }, $("h2", {}, $("span", { class: "step" }, "6"), "The other lines"))];
  for (const a of alts) {
    const box = $("div", { class: "alt" }, $("h3", {}, `If ${a.line}`));
    for (const st of a.steps) {
      const acts = order(Object.keys(st.actions)); const cm = colorMap(acts);
      box.append($("div", { class: "frow" }, $("span", {}, `${st.player}${st.facing ? " vs " + st.facing : ""}`),
        $("div", { class: "bar", title: acts.map((x) => `${x} ${pct(st.actions[x])}`).join(", ") }, acts.map((x) => $("i", { style: `width:${st.actions[x]}%;background:${cm[x]}` }))),
        $("span", { class: "val" }, acts.filter((x) => st.actions[x] >= 1).slice(0, 1).map((x) => `${x.split(" ")[0]} ${pct(st.actions[x])}`)[0] || "")));
    }
    parts.push(box);
  }
  return $("section", { class: "panel" }, parts);
}
function icmPanel() {
  const i = D.icm || {};
  const f = D.format || {};
  if (!f.icm && !Object.keys(i).length) return null;
  const parts = [$("div", { class: "panel-head" }, $("h2", {}, "ICM"))];
  if (i.bubble_factor) {
    parts.push($("div", { class: "stats" }, Object.entries(i.bubble_factor).map(([k, v]) => $("div", { class: "stat" }, $("span", { class: "muted small" }, `Bubble factor, ${k}`), $("span", { class: "big" }, (+v).toFixed(2))))));
    for (const [k, v] of Object.entries(i)) if (k.endsWith("_call")) parts.push($("p", { class: "small" }, `${k.replace("_call", "")} calling the all-in needs ${pct(100 * v.chip_required)} in chip EV and ${pct(100 * v.icm_required)} with ICM (risk premium ${pct(100 * v.risk_premium)}).`));
  } else {
    const shortest = [...D.table].sort((a, b) => a.stack - b.stack)[0];
    parts.push($("p", { class: "prose" }, `This solution uses ICM. ${D.hero === shortest.seat ? `${D.hero} is the shortest stack, so every opponent covers it and an all-in risks its tournament.` : `Whoever is covered risks elimination in an all-in, so losing chips costs them more than winning chips gains.`} That makes the risky line need more equity than in chip EV.`),
      $("p", { class: "small muted" }, "Payouts weren't captured, so no bubble factor is shown."));
  }
  return $("section", { class: "panel" }, parts);
}
function rewindPanel() {
  const rw = D.rewind; if (!rw || !rw.rows) return null;
  const steps = rw.steps || [];
  const t = $("table", { class: "t" },
    $("thead", {}, $("tr", {}, $("th", {}, "Combo"), $("th", {}, "Type"), steps.map((s) => $("th", {}, s)), $("th", {}, "Reaches"))),
    $("tbody", {}, rw.rows.map((r) => {
      const fr = r.freqs.map((x) => (x > 1 ? x / 100 : x));
      const reach = fr.reduce((a, b) => a * b, 1);
      return $("tr", {}, $("td", { class: "num" }, r.hand), $("td", {}, r.label || ""), fr.map((x) => $("td", { class: "num" }, pct(100 * x))),
        $("td", {}, $("div", { class: "frow", style: "grid-template-columns:minmax(60px,1fr) 46px" }, $("div", { class: "bar" }, $("i", { style: `width:${100 * reach}%;background:var(--accent)` })), $("span", { class: "val" }, `${(100 * reach).toFixed(0)}%`))));
    })));
  return $("section", { class: "panel" }, $("div", { class: "panel-head" }, $("h2", {}, "How the range got here")), $("p", { class: "prose muted" }, `How much of each ${rw.player} combo survives each earlier street to reach this spot.`), $("div", { class: "tbl-wrap" }, t));
}
function breakdownPanel() {
  const bd = D.breakdown || {}; const eq = D.equity || {};
  if (!Object.keys(bd).length && !Object.keys(eq).length) return null;
  const parts = [$("div", { class: "panel-head" }, $("h2", {}, "Range shape"))];
  if (Object.keys(eq).length) parts.push($("div", { class: "stats" }, Object.entries(eq).map(([p, e]) => $("div", { class: "stat" }, $("span", { class: "muted small" }, `${p} equity · ${e.combos} combos`), $("span", { class: "big" }, pct(e.equity))))));
  const palette = ["var(--a-allin)", "var(--a-raise2)", "var(--a-raise1)", "var(--a-call)", "var(--a-check)", "var(--a-fold)", "var(--muted)"];
  for (const [p, cats] of Object.entries(bd)) {
    parts.push($("div", { class: "frow", style: "grid-template-columns:110px minmax(0,1fr)" }, $("span", {}, p),
      $("div", { class: "bar", style: "height:22px" }, cats.map((c, k) => $("i", { style: `width:${c.pct}%;background:${palette[k % palette.length]}`, title: `${c.category} ${pct(c.pct)}` })))));
  }
  const firstCats = Object.values(bd)[0] || [];
  parts.push($("div", { class: "legend" }, firstCats.map((c, k) => $("span", {}, $("span", { class: "sw", style: `background:${palette[k % palette.length]}` }), c.category))));
  return $("section", { class: "panel" }, parts);
}
function coveragePanel() {
  const col = { covered: "var(--good)", partial: "var(--warn)", missing: "var(--bad)", "n/a": "var(--line)" };
  return $("section", { class: "panel" },
    $("div", { class: "panel-head" }, $("h2", {}, "What this explanation covers")),
    $("div", { class: "cov" }, D.coverage.map((c) => $("span", { title: c.note || c.status }, $("span", { class: "dot", style: `background:${col[c.status]}` }), c.title))),
    $("div", { class: "keyline" }, Object.entries(col).map(([k, v]) => $("span", {}, $("span", { class: "keybox", style: `background:${v};border-radius:50%` }), k))),
    D.notes && D.notes.length ? $("ul", { class: "small muted", style: "margin:0;padding-left:18px" }, D.notes.map((n) => $("li", {}, n))) : null);
}

/* ---------- assemble ---------- */
const app = document.getElementById("app");
const shapeBlock = shapePanel();
const blocks = [header(), summary(), shapeBlock, laddersPanel(), shapeBlock ? null : evPanel(), responsePanel()];
const pair = [blockersPanel(), linesPanel(), icmPanel()].filter(Boolean);
if (pair.length) blocks.push($("div", { class: pair.length === 3 ? "grid3" : pair.length === 2 ? "grid2" : "" }, pair));
blocks.push(breakdownPanel(), rewindPanel(), coveragePanel(), $("footer", {}, "Strategy numbers come from the solver; the harness only arranges them and adds arithmetic (fold-through, card removal, ICM). Hover any cell for its strategy and EV."));
for (const b of blocks) if (b) app.append(b);
</script>
