  const palette = ["var(--a-allin)", "var(--a-raise2)", "var(--a-raise1)", "var(--a-call)", "var(--a-check)", "var(--a-fold)", "var(--muted)"];
  for (const [p, cats] of Object.entries(bd)) {
    parts.push($("div", { class: "frow", style: "grid-template-columns:110px minmax(0,1fr)" }, $("span", {}, p),
      $("div", { class: "bar", style: "height:22px" }, cats.map((c, k) => $("i", { style: `width:${c.pct}%;background:${palette[k % palette.length]}`, title: `${c.category} ${pct(c.pct)}` })))));
  }
  const firstCats = Object.values(bd)[0] || [];
  parts.push($("div", { class: "legend" }, firstCats.map((c, k) => $("span", {}, $("span", { class: "sw", style: `background:${palette[k % palette.length]}` }), c.category))));
  return $("section", { class: "panel" }, parts);
}
function coveragePanel() {
  const col = { covered: "var(--good)", partial: "var(--warn)", missing: "var(--bad)", "n/a": "var(--line)" };
  return $("section", { class: "panel" },
    $("div", { class: "panel-head" }, $("h2", {}, "What this explanation covers")),
    $("div", { class: "cov" }, D.coverage.map((c) => $("span", { title: c.note || c.status }, $("span", { class: "dot", style: `background:${col[c.status]}` }), c.title))),
    $("div", { class: "keyline" }, Object.entries(col).map(([k, v]) => $("span", {}, $("span", { class: "keybox", style: `background:${v};border-radius:50%` }), k))),
    D.notes && D.notes.length ? $("ul", { class: "small muted", style: "margin:0;padding-left:18px" }, D.notes.map((n) => $("li", {}, n))) : null);
}

/* ---------- assemble ---------- */
const app = document.getElementById("app");
const shapeBlock = shapePanel();
const blocks = [header(), summary(), shapeBlock, laddersPanel(), shapeBlock ? null : evPanel(), responsePanel()];
const pair = [blockersPanel(), linesPanel(), icmPanel()].filter(Boolean);
if (pair.length) blocks.push($("div", { class: pair.length === 3 ? "grid3" : pair.length === 2 ? "grid2" : "" }, pair));
blocks.push(breakdownPanel(), rewindPanel(), coveragePanel(), $("footer", {}, "Strategy numbers come from the solver; the harness only arranges them and adds arithmetic (fold-through, card removal, ICM). Hover any cell for its strategy and EV."));
for (const b of blocks) if (b) app.append(b);
</script>
