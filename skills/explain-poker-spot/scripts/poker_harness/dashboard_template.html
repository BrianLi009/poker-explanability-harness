<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a solver-console sheet. Summary band on top, then the coach's order:
   global shape (range grid + action ranges), borderlines, EV at the border,
   the table's response, card removal, other lines, ICM, coverage. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #17202a;
  --muted: #5b6878;
  --line: #d6dde5;
  --soft: #e4e9ef;
  --accent: #1d6b57;
  --accent-ink: #ffffff;
  --a-allin: #7a1c2b;
  --a-raise3: #a1283a;
  --a-raise2: #c9433a;
  --a-raise1: #e0735a;
  --a-call: #3a9a5c;
  --a-check: #4b82c4;
  --a-fold: #3e6fae;
  --good: #2f8a55;
  --warn: #b7791f;
  --bad: #b23a3a;
  --empty: #e9edf2;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --panel: #161d25; --ink: #e5eaf0; --muted: #91a0b0; --line: #26313d; --soft: #1d2631;
    --accent: #47b394; --accent-ink: #08130f; --empty: #1b232c;
    --a-fold: #4a7cc0; --a-check: #5b90d0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --panel: #161d25; --ink: #e5eaf0; --muted: #91a0b0; --line: #26313d; --soft: #1d2631;
  --accent: #47b394; --accent-ink: #08130f; --empty: #1b232c;
  --a-fold: #4a7cc0; --a-check: #5b90d0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 800; font-stretch: 75%; letter-spacing: -0.01em; line-height: 1.05; }
h2 { font-size: 15px; font-weight: 700; font-stretch: 80%; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
h3 { font-size: 16px; font-weight: 700; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.step { font-family: var(--font-data); font-size: 12px; color: var(--accent); margin-right: 8px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 900px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }

/* Header */
.eyebrow { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.chip.accent { background: var(--accent); color: var(--accent-ink); }
header.top { display: flex; flex-direction: column; gap: 10px; }
.source { font-size: 12.5px; color: var(--muted); max-width: 90ch; }
.seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; }
.seat { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--panel); display: flex; flex-direction: column; gap: 1px; }
.seat .name { font-weight: 700; font-size: 13px; font-stretch: 85%; font-family: var(--font-display); }
.seat .stack { font-family: var(--font-data); font-size: 13px; }
.seat .tag { font-size: 11px; color: var(--muted); }
.seat.hero { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.seat.villain { border-color: var(--a-raise2); box-shadow: inset 0 0 0 1px var(--a-raise2); }
.board { display: flex; gap: 6px; }
.card { width: 38px; height: 52px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 19px; }
.suit-s { color: var(--ink); } .suit-h { color: #c4313b; } .suit-d { color: #2f6fd0; } .suit-c { color: #2f8a55; }

/* Summary band */
.summary { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: stretch; }
@media (max-width: 900px) { .summary { grid-template-columns: minmax(0, 1fr); } }
.takeaway { background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
.takeaway .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.85; font-weight: 700; }
.takeaway p { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.35; font-family: var(--font-display); font-stretch: 92%; }
.takeaway ul { margin: 4px 0 0; padding-left: 18px; font-size: 14px; opacity: 0.92; }

/* Action bar */
.actbar { display: flex; height: 34px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); }
.actbar > div { display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-data); font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.rangelist { display: flex; flex-direction: column; gap: 8px; }
.rangelist .row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: baseline; }
@media (max-width: 560px) { .rangelist .row { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.rangelist .who { font-weight: 700; font-size: 14px; }
.rangelist .hands { font-family: var(--font-data); font-size: 13px; overflow-wrap: anywhere; }

/* Range grid */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: inherit; font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab:focus-visible, .ladder button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rgrid-wrap { overflow-x: auto; }
.rgrid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; min-width: 300px; }
.cell { position: relative; aspect-ratio: 1 / 1; border-radius: 3px; overflow: hidden; background: var(--empty); display: flex; }
.cell .bars { position: absolute; inset: 0; display: flex; }
.cell .bars > i { display: block; height: 100%; }
.cell .lab { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-stretch: 75%; font-size: clamp(7.5px, 1.1vw, 12.5px); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,0.35); pointer-events: none; }
.cell.empty .lab { color: var(--muted); text-shadow: none; opacity: 0.6; }
.cell.dim { opacity: 0.35; }
.cell.mark-in { box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px var(--ink); z-index: 1; }
.cell.mark-out { box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px var(--warn); z-index: 1; }
.cell.hero-hand { box-shadow: inset 0 0 0 2px #fff, 0 0 0 3px var(--accent); z-index: 2; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.4; max-width: 260px; }
.keyline { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.keybox { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -2px; background: var(--empty); }

/* Ladders */
.ladders { display: flex; flex-direction: column; gap: 10px; }
.ladder { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: center; }
@media (max-width: 560px) { .ladder { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.ladder .fam { font-size: 13px; font-weight: 600; }
.ladder .rungs { display: grid; grid-template-columns: repeat(13, minmax(22px, 1fr)); gap: 2px; overflow-x: auto; }
.ladder .rungs .cell { aspect-ratio: auto; height: 30px; }
.ladder .note { grid-column: 2; font-size: 12.5px; color: var(--muted); }
@media (max-width: 560px) { .ladder .note { grid-column: 1; } }

/* Charts */
svg text { fill: var(--muted); font-family: var(--font-data); font-size: 11px; }
svg .ink { fill: var(--ink); }
.funnel { display: flex; flex-direction: column; gap: 8px; }
.frow { display: grid; grid-template-columns: 110px minmax(0, 1fr) 92px; gap: 10px; align-items: center; font-size: 13px; }
.frow .bar { height: 18px; background: var(--soft); border-radius: 4px; overflow: hidden; display: flex; }
.frow .bar > i { display: block; height: 100%; }
.frow .val { font-family: var(--font-data); text-align: right; }
.gauge { position: relative; height: 26px; background: var(--soft); border-radius: 6px; overflow: visible; }
.gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--a-fold); }
.gauge .need { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--bad); }
.gauge .needlab { position: absolute; top: -22px; transform: translateX(-50%); font-size: 11.5px; color: var(--bad); font-family: var(--font-data); white-space: nowrap; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .big { font-family: var(--font-data); font-size: 26px; font-weight: 600; }
.stats { display: flex; gap: 24px; flex-wrap: wrap; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--soft); vertical-align: top; }
table.t td.num { text-align: right; }
.tbl-wrap { overflow-x: auto; }
.cov { display: flex; flex-wrap: wrap; gap: 6px; }
.cov span { font-size: 12.5px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line); display: inline-flex; gap: 6px; align-items: center; }
.cov .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.evsvg { width: 100%; max-width: 620px; height: auto; display: block; }
.alt { border-left: 3px solid var(--line); padding-left: 12px; display: flex; flex-direction: column; gap: 6px; }
p { margin: 0; }
.prose { max-width: 70ch; font-size: 14px; }
footer { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .cell, .tab { transition: opacity .15s, box-shadow .15s, background .15s; } }
</style>

<div class="wrap" id="app"></div>
<div class="tip" id="tip" hidden></div>

<script>
const D = __DATA__;
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};
const pct = (x) => (x === null || x === undefined ? "–" : `${(+x).toFixed(1)}%`);
const bb = (x) => (x === null || x === undefined ? "–" : `${x >= 0 ? "+" : ""}${(+x).toFixed(2)}bb`);
const RANKS = D.ranks;

/* ---------- action colours (GTO Wizard's language) ---------- */
function sizeOf(a) { const m = a.match(/([\d.]+)/); return m ? parseFloat(m[1]) : 0; }
function isAllin(a) { return /all.?in|jam|shove/i.test(a); }
function colorMap(actions) {
  const map = {};
  const raises = actions.filter((a) => !isAllin(a) && /^(raise|bet)/i.test(a)).sort((x, y) => sizeOf(x) - sizeOf(y));
  const shades = ["--a-raise1", "--a-raise2", "--a-raise3"];
  raises.forEach((a, i) => { map[a] = `var(${shades[Math.min(shades.length - 1, raises.length === 1 ? 1 : i)]})`; });
  for (const a of actions) {
    if (map[a]) continue;
    if (isAllin(a)) map[a] = "var(--a-allin)";
    else if (/^call/i.test(a)) map[a] = "var(--a-call)";
    else if (/^check/i.test(a)) map[a] = "var(--a-check)";
    else if (/^fold/i.test(a)) map[a] = "var(--a-fold)";
    else map[a] = "var(--muted)";
  }
  return map;
}
function order(actions) {
  const rank = (a) => (isAllin(a) ? 0 : /^(raise|bet)/i.test(a) ? 1 - sizeOf(a) / 1000 : /^call/i.test(a) ? 2 : /^check/i.test(a) ? 3 : /^fold/i.test(a) ? 4 : 5);
  return [...actions].sort((x, y) => rank(x) - rank(y));
}

/* ---------- header ---------- */
function header() {
  const f = D.format || {};
  const chips = [f.game, f.structure, f.phase, f.icm ? "ICM" : null, f.average_stack ? `avg ${f.average_stack}bb` : null].filter(Boolean);
  const scene = D.scene || {};
  const seats = $("div", { class: "seats" }, D.table.map((r) => {
    const role = r.seat === D.hero ? "hero" : r.seat === D.villain ? "villain" : "";
    const tag = role === "hero" ? "explaining" : role === "villain" ? "opponent" : "";
    return $("div", { class: `seat ${role}` },
      $("span", { class: "name" }, r.seat),
      $("span", { class: "stack" }, `${(+r.stack).toFixed(r.stack % 1 ? 1 : 0)}bb`),
      $("span", { class: "tag" }, r.behind !== null && r.behind !== undefined ? `${r.behind}bb behind${tag ? " · " + tag : ""}` : tag));
  }));
  const parts = [
    $("div", { class: "eyebrow" }, chips.map((c, i) => $("span", { class: i === 0 ? "chip accent" : "chip" }, c))),
    $("h1", {}, D.title),
  ];
  const facts = [];
  if (D.pot !== null && D.pot !== undefined) facts.push(`Pot ${D.pot}bb`);
  if (scene.effective !== undefined) facts.push(`${scene.effective}bb effective`);
  if (scene.covers) facts.push(`${scene.covers} covers ${scene.covers === D.hero ? D.villain : D.hero}`);
  if (D.history && D.history.length) facts.push(D.history.map((h) => h.actions).join(" · "));
  parts.push($("p", { class: "muted small" }, facts.join("  ·  ")));
  if (D.board.length) {
    parts.push($("div", { class: "board" }, D.board.map((c) => $("div", { class: `card suit-${c[1]}` }, c[0] + { s: "♠", h: "♥", d: "♦", c: "♣" }[c[1]]))));
  }
  parts.push(seats);
  if (D.source) parts.push($("p", { class: "source" }, D.source));
  return $("header", { class: "top" }, parts);
}

/* ---------- summary band ---------- */
function summary() {
  const n = D.node;
  const left = $("div", { class: "takeaway" },
    $("span", { class: "label" }, "Takeaway"),
    $("p", {}, D.lessons[0] || "Capture the opponent's response to find the lesson."),
    D.lessons.length > 1 ? $("ul", {}, D.lessons.slice(1, 3).map((l) => $("li", {}, l))) : null);
  const right = $("section", { class: "panel" });
  if (n) {
    const acts = order(Object.keys(n.actions));
    const cm = colorMap(acts);
    right.append(
      $("div", { class: "panel-head" }, $("h2", {}, `${n.player}'s whole range`)),
      $("div", { class: "actbar", role: "img", "aria-label": acts.map((a) => `${a} ${pct(n.actions[a])}`).join(", ") },
        acts.filter((a) => n.actions[a] >= 0.5).map((a) => $("div", { style: `width:${n.actions[a]}%;background:${cm[a]}`, title: `${a} ${pct(n.actions[a])}` }, n.actions[a] >= 9 ? pct(n.actions[a]) : ""))),
      $("div", { class: "legend" }, acts.map((a) => $("span", {}, $("span", { class: "sw", style: `background:${cm[a]}` }), `${a} `, $("span", { class: "num muted" }, pct(n.actions[a]))))));
    if (D.hero_hand) {
      const h = D.hero_hand;
      const st = Object.entries(h.strategy || {}).filter(([, v]) => v >= 0.5).sort((x, y) => y[1] - x[1]).map(([a, v]) => `${a} ${pct(v)}`).join(", ");
      const ev = h.ev ? Object.entries(h.ev).map(([a, v]) => `${a} ${bb(v)}`).join(" · ") : h.ev_best !== null && h.ev_best !== undefined ? `EV ${bb(h.ev_best)}` : "";
      right.append($("p", { class: "small" }, $("b", {}, `Your hand ${h.hand}: `), st, ev ? $("span", { class: "muted num" }, `  (${ev})`) : null));
    }
  }
  return $("div", { class: "summary" }, left, right);
}

/* ---------- 13x13 grid ---------- */
const tip = document.getElementById("tip");
function showTip(e, html) { tip.innerHTML = html; tip.hidden = false; moveTip(e); }
function moveTip(e) {
  const pad = 14; const w = tip.offsetWidth; const h = tip.offsetHeight;
  let x = e.clientX + pad; let y = e.clientY + pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > innerHeight - 8) y = e.clientY - h - pad;
  tip.style.left = `${Math.max(8, x)}px`; tip.style.top = `${Math.max(8, y)}px`;
}
function hideTip() { tip.hidden = true; }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function classAt(i, j) {
  const r1 = RANKS[12 - i], r2 = RANKS[12 - j];
  if (i === j) return r1 + r2;
  return i < j ? r1 + r2 + "s" : r2 + r1 + "o";
}
function cellEl(cls, row, cm, acts, opts = {}) {
  const el = $("div", { class: "cell", role: "img" });
  if (!row) {
    el.classList.add("empty");
    el.append($("span", { class: "lab" }, cls));
    el.setAttribute("aria-label", `${cls}: not in range`);
    return el;
  }
  const bars = $("span", { class: "bars" });
  for (const a of acts) {
    const v = row.s[a] || 0;
    if (v > 0.2) bars.append($("i", { style: `width:${v}%;background:${cm[a]}` }));
  }
  el.append(bars, $("span", { class: "lab" }, cls));
  if (row.w !== null && row.w !== undefined && row.w < 0.999) el.style.opacity = String(0.35 + 0.65 * Math.max(0, Math.min(1, row.w)));
  const desc = acts.filter((a) => (row.s[a] || 0) >= 0.5).map((a) => `${a} ${pct(row.s[a])}`).join(", ");
  el.setAttribute("aria-label", `${cls}: ${desc}`);
  el.addEventListener("pointerenter", (e) => {
    const evs = row.ev ? Object.entries(row.ev).map(([a, v]) => `${esc(a)} ${bb(v)}`).join("<br>") : row.evb !== null && row.evb !== undefined ? `EV ${bb(row.evb)}` : "";
    showTip(e, `<b>${esc(cls)}</b>${row.w !== null && row.w !== undefined ? ` <span style="opacity:.7">weight ${(+row.w).toFixed(2)}</span>` : ""}<br>${acts.filter((a) => (row.s[a] || 0) >= 0.1).map((a) => `${esc(a)} ${pct(row.s[a])}`).join("<br>")}${evs ? `<br><span style="opacity:.75">${evs}</span>` : ""}${opts.note && opts.note[cls] ? `<br><i>${esc(opts.note[cls])}</i>` : ""}`);
  });
  el.addEventListener("pointermove", moveTip);
  el.addEventListener("pointerleave", hideTip);
  return el;
}
function rangeGrid(grid, actions, opts = {}) {
  const acts = order(actions);
  const cm = colorMap(acts);
  const g = $("div", { class: "rgrid" });
  for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) {
    const cls = classAt(i, j);
    const el = cellEl(cls, grid[cls], cm, acts, opts);
    if (opts.marks && opts.marks[cls] === "in") el.classList.add("mark-in");
    if (opts.marks && opts.marks[cls] === "out") el.classList.add("mark-out");
    if (opts.hero && cls === opts.hero) el.classList.add("hero-hand");
    g.append(el);
  }
  return $("div", { class: "rgrid-wrap" }, g);
}

function shapePanel() {
  if (!D.node || !Object.keys(D.grid).length) return null;
  const acts = order(Object.keys(D.node.actions));
  const cm = colorMap(acts);
  const views = [{ key: "hero", label: `${D.node.player}'s strategy` }];
